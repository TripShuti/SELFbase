services:
  # ── Garage (S3-compatible blob storage) ──────────────────────────────────────
  # Used for file uploads (images, audio, attachments). Same API as AWS S3 / R2.
  # Replaces MinIO (EOL — upstream repo archived April 2026). The entrypoint
  # self-provisions layout + bucket + key, importing S3_ACCESS_KEY/S3_SECRET_KEY
  # so the S3_* env contract on web/worker is unchanged. Host port 9000 is kept
  # (Garage's S3 API listens on 3900 internally) so derived public endpoints
  # keep working. Override S3_* env to use external storage (e.g. R2) instead.
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: selfbase-garage
    ports:
      - "9000:3900"   # S3 API (host 9000 preserved from the MinIO era)
    environment:
      # Secrets read by Garage when absent from garage.toml. Compose-network
      # internal (RPC/admin ports are not published); defaults are fine for
      # local self-hosting, override in .env for anything exposed.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-9dd7325b40c1f0ab926e0a35e6592f9026fda9ec7d5c0d1fa1c4c05dfa79dc44}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-selfbase-garage-admin}
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./server/docker/garage.toml:/etc/garage.toml:ro
    restart: unless-stopped
    networks:
      - pear

  # One-shot provisioner: layout + bucket + key import via the admin API.
  garage-init:
    image: alpine:3.20
    container_name: selfbase-garage-init
    depends_on:
      - garage
    entrypoint: ["/bin/sh", "/garage-init.sh"]
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-selfbase-garage-admin}
      S3_BUCKET: ${S3_BUCKET:-selfbase-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-selfbase-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-selfbase-secret-key-change-me}
    volumes:
      - ./server/docker/garage-init.sh:/garage-init.sh:ro
    restart: "no"
    networks:
      - pear

  # ── SpacetimeDB ────────────────────────────────────────────────────────────
  # Pre-build the module before starting: cd server && spacetime build
  spacetimedb:
    image: clockworklabs/spacetime:v2.0.3
    container_name: selfbase-spacetimedb
    ports:
      - "3000:3000"
    volumes:
      - spacetimedb-data:/stdb/data
      # Persist the spacetime CLI identity across container restarts.
      # Without this, every restart generates a new identity that isn't the
      # database owner, causing a 403 on publish.
      - spacetimedb-config:/root/.config/spacetime
      # Entrypoint script (starts SpacetimeDB then publishes the module)
      - ./server/docker/entrypoint.sh:/entrypoint.sh:ro
      # Pre-built module WASM — run `cd server && spacetime build` first
      - ./server/spacetimedb/target/wasm32-unknown-unknown/release/server.wasm:/module/server.wasm:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      STDB_DB_NAME: ${SPACETIMEDB_DB_NAME:-selfbase}
    user: root
    restart: unless-stopped
    networks:
      - pear

  # ── Next.js web client ──────────────────────────────────────────────────────
  web:
    # Image pulled from the Forgejo container registry on the remote.
    # Set WEB_IMAGE in your .env to the full registry path, e.g.:
    #   WEB_IMAGE=registry.yourdomain.com/kara/selfbase-web:latest
    # Falls back to a local tag for dev builds.
    image: ${WEB_IMAGE:-selfbase-web:latest}
    pull_policy: build
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked into the browser bundle at build time.
        # The browser must reach these URLs directly, so use the public-facing
        # addresses (Cloudflare Tunnel hostname or exposed host port).
        NEXT_PUBLIC_SPACETIMEDB_URI: ${SPACETIMEDB_PUBLIC_URI-ws://localhost:3000}
        NEXT_PUBLIC_SPACETIMEDB_DB_NAME: ${SPACETIMEDB_DB_NAME:-selfbase}
        NEXT_PUBLIC_SPACETIMEAUTH_CLIENT_ID: ${SPACETIMEAUTH_CLIENT_ID:-}
        NEXT_PUBLIC_SPACETIMEAUTH_AUTHORITY: ${SPACETIMEAUTH_AUTHORITY:-}
        # Optional same-origin proxy to SpacetimeDB via Next.js rewrites.
        # Set SPACETIMEDB_PROXY_ORIGIN=http://spacetimedb:3000 and leave
        # SPACETIMEDB_PUBLIC_URI empty to let the browser use ws(s)://<web-host>.
        # The web app proxies /v1/* to the internal SpacetimeDB service.
        SPACETIMEDB_PROXY_ORIGIN: ${SPACETIMEDB_PROXY_ORIGIN:-}
    container_name: selfbase-web
    ports:
      - "3001:3001"
    depends_on:
      - spacetimedb
      - garage
    environment:
      # S3-compatible blob storage (default: Garage in this stack)
      # Override to use external storage (e.g. R2, S3): set S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      # Optional. Browser upload URL (presigned URLs). If unset, derived from request host + :9000 (zero config when app and Garage are on the same host — Garage's S3 API is published on host port 9000). Set only when storage is on another host/port.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-selfbase-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-selfbase-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-selfbase-secret-key-change-me}
      S3_REGION: ${S3_REGION:-us-east-1}
    restart: unless-stopped
    networks:
      - pear

networks:
  pear:
    driver: bridge

volumes:
  spacetimedb-data:
  spacetimedb-config:
  garage-meta:
  garage-data:
